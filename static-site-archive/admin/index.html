<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | The Yoga School</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://3989ac5bcbe1edfc864a-0a7f10f87519dba22d2dbc6233a731e5.ssl.cf2.rackcdn.com/TheYogaSchool/Site_Logo2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body::after { display: none; }
    body { background: var(--c-light); min-height: 100vh; }
    .a-center { min-height: 100vh; display: grid; place-items: center; padding: var(--s-2); }
    .a-card { width: min(420px, 100%); background: var(--c-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: var(--s-5) var(--s-4); }
    .a-card img { width: 64px; height: 64px; border-radius: 50%; margin-bottom: var(--s-2); }
    .a-card h1 { font-size: 2rem; margin-bottom: 4px; }
    .a-card .field { margin-top: var(--s-2); }
    .a-card .btn { width: 100%; margin-top: var(--s-3); }
    .a-msg { margin: var(--s-2) 0 0; padding: 10px 14px; border-radius: var(--radius-sm); font-size: var(--fs-sm); }
    .a-msg--err { background: var(--c-accent-100); color: var(--c-accent-ink); }
    .a-msg--ok { background: var(--c-secondary-100); color: var(--c-secondary-ink); }
    .a-link { background: none; border: 0; padding: 0; color: var(--c-secondary-ink); font-size: var(--fs-sm); text-decoration: underline; margin-top: var(--s-2); }

    .a-app { display: grid; min-height: 100vh; grid-template-columns: 1fr; }
    @media (min-width: 960px) { .a-app { grid-template-columns: 260px 1fr; } }
    .a-side { background: var(--c-primary); color: var(--c-white); padding: var(--s-3) var(--s-2); display: flex; flex-direction: column; gap: var(--s-2); }
    @media (max-width: 959px) { .a-side { position: sticky; top: 0; z-index: 20; } .a-side nav { display: flex; overflow-x: auto; gap: 6px; } .a-side .a-user { display: none; } }
    .a-brand { display: flex; align-items: center; gap: 10px; color: var(--c-white); text-decoration: none; font-family: var(--f-heading); font-size: 1.25rem; font-weight: 600; }
    .a-brand img { width: 40px; height: 40px; border-radius: 50%; }
    .a-side nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 10px 14px; border: 0; border-radius: var(--radius-sm); background: transparent; color: rgba(255, 255, 255, 0.85); font-weight: 500; text-align: left; white-space: nowrap; }
    .a-side nav button:hover { background: rgba(255, 255, 255, 0.1); color: var(--c-white); }
    .a-side nav button[aria-current="page"] { background: var(--c-white); color: var(--c-primary); }
    .a-badge { min-width: 22px; padding: 1px 7px; border-radius: 99px; background: var(--c-accent); color: var(--c-primary); font-size: 0.75rem; font-weight: 700; text-align: center; }
    .a-user { margin-top: auto; font-size: var(--fs-xs); opacity: 0.85; }
    .a-user button { margin-top: 8px; background: rgba(255, 255, 255, 0.12); color: var(--c-white); border: 0; border-radius: 99px; padding: 8px 14px; }
    .a-user a { color: var(--c-white); }

    .a-main { padding: var(--s-3) var(--s-2) var(--s-8); min-width: 0; }
    @media (min-width: 768px) { .a-main { padding: var(--s-5); } }
    .a-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-3); }
    .a-head h1 { font-size: 2.25rem; margin: 0; }
    .a-head p { margin: 4px 0 0; color: var(--c-ink-soft); font-size: var(--fs-sm); }
    .a-tools { display: flex; gap: 10px; flex-wrap: wrap; }
    .a-tools input { min-height: 44px; padding: 8px 14px; border: 1.5px solid var(--c-line); border-radius: 99px; background: var(--c-white); }
    .a-table-wrap { background: var(--c-white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow-x: auto; }
    table.a-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
    .a-table th { text-align: left; padding: 12px 16px; font-size: var(--fs-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-ink-soft); border-bottom: 1px solid var(--c-line); white-space: nowrap; }
    .a-table td { padding: 12px 16px; border-bottom: 1px solid var(--c-light); vertical-align: top; }
    .a-table tr:last-child td { border-bottom: 0; }
    .a-table tr.is-new td:first-child { box-shadow: inset 3px 0 0 var(--c-secondary); }
    .a-table .a-actions { white-space: nowrap; text-align: right; }
    .a-table .a-actions button { margin-left: 6px; }
    .a-pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
    .a-pill--on { background: var(--c-secondary-100); color: var(--c-secondary-ink); }
    .a-pill--off { background: var(--c-accent-100); color: var(--c-accent-ink); }
    .a-empty { padding: var(--s-6) var(--s-3); text-align: center; color: var(--c-ink-soft); }
    .a-clip { max-width: 360px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    dialog.a-dialog { width: min(760px, 100% - 24px); max-height: 92vh; padding: 0; border: 0; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
    dialog.a-dialog::backdrop { background: rgba(7, 26, 56, 0.55); }
    .a-dialog form { display: flex; flex-direction: column; max-height: 92vh; }
    .a-dialog header, .a-dialog footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--c-light); }
    .a-dialog footer { border-top: 1px solid var(--c-light); border-bottom: 0; flex-wrap: wrap; }
    .a-dialog header h2 { font-size: 1.75rem; margin: 0; }
    .a-dialog .a-body { overflow-y: auto; padding: var(--s-3); display: grid; gap: var(--s-2); grid-template-columns: 1fr 1fr; }
    .a-dialog .field { grid-column: 1 / -1; }
    @media (min-width: 640px) { .a-dialog .field--half { grid-column: auto; } }
    .a-dialog textarea { min-height: 110px; }
    .a-dialog textarea.big { min-height: 280px; }
    .a-help { margin: 4px 0 0; font-size: var(--fs-xs); color: var(--c-ink-soft); }
    .a-check { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--c-primary); }
    .a-check input { width: 20px !important; height: 20px; min-height: 0 !important; }
    .a-img { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    .a-img img { width: 96px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--c-light); }
    .a-danger { border-color: var(--c-accent-ink) !important; color: var(--c-accent-ink) !important; }
    .a-danger:hover { background: var(--c-accent-ink) !important; color: var(--c-white) !important; }
    .a-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; padding: 12px 20px; border-radius: 99px; background: var(--c-primary); color: var(--c-white); box-shadow: var(--shadow-lg); font-size: var(--fs-sm); }
    .a-msgview p { white-space: pre-wrap; }
    .a-msgview dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: var(--fs-sm); margin: 0 0 var(--s-2); }
    .a-msgview dt { color: var(--c-ink-soft); }
    .a-msgview dd { margin: 0; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>

  <!-- Sign in -->
  <div class="a-center" id="login-view" hidden>
    <form class="a-card" id="login-form" novalidate>
      <img src="https://3989ac5bcbe1edfc864a-0a7f10f87519dba22d2dbc6233a731e5.ssl.cf2.rackcdn.com/TheYogaSchool/Site_Logo2.png" alt="The Yoga School logo" width="64" height="64">
      <h1>Admin sign in</h1>
      <p class="lead" style="font-size:var(--fs-sm)">The Yoga School website content</p>
      <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn--primary" type="submit">Sign in</button>
      <button class="a-link" type="button" id="forgot">Forgot password?</button>
      <p class="a-msg" id="login-msg" role="alert" hidden></p>
    </form>
  </div>

  <!-- Not configured -->
  <div class="a-center" id="setup-view" hidden>
    <div class="a-card">
      <h1>Connect Supabase</h1>
      <p>Add your Supabase Project URL and anon key to <code>assets/js/supabase-config.js</code>, then reload this page. See <code>supabase/README.md</code>.</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="a-app" id="app-view" hidden>
    <aside class="a-side">
      <a class="a-brand" href="/pages/home"><img src="https://3989ac5bcbe1edfc864a-0a7f10f87519dba22d2dbc6233a731e5.ssl.cf2.rackcdn.com/TheYogaSchool/Site_Logo2.png" alt="" width="40" height="40">The Yoga School</a>
      <nav aria-label="Sections" id="a-nav"></nav>
      <div class="a-user"><span id="a-user-email"></span><br><a href="/pages/home" target="_blank" rel="noopener">View website ↗</a><br><button type="button" id="sign-out">Sign out</button></div>
    </aside>
    <main class="a-main" id="a-main"></main>
  </div>

  <dialog class="a-dialog" id="editor"></dialog>

  <script src="../assets/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
